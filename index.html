<script>/* loader: fresh JS on every load, in order */(function(){var t=Date.now();['thryd_keep.js?v=1','mlib_pin.js?v=1','live_return.js?v=1','medium_cuts.js?v=1','tweet_embed.js?v=1','projector.js?v=58','extras.js?v=50','alive.js?v=50'].forEach(function(f){var e=document.createElement('script');e.src='assets/'+f+'&t='+t;e.async=false;document.body.appendChild(e);});})();</script>
<script>/* auto-update: reload when shipped code changes (checks every 45s; waits until nobody is dragging) */(function(){var CV='79124b1e74';if(CV.indexOf('__')===0)return;
function idle(){var b=document.body.classList;return !b.contains('dragmode')&&!document.querySelector('#objs .dob.lifting,#objs .dob[data-held="1"]');}
