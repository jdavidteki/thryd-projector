<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache">

<body>

<script>/* loader: fresh JS on every load, in order */(function(){var t=Date.now();var L=['thryd_keep.js?v=1','mlib_pin.js?v=1','live_return.js?v=1','medium_cuts.js?v=1','tweet_embed.js?v=1','projector.js?v=58','frame_feed.js?v=1','extras.js?v=50','alive.js?v=50'];if(!/(?:^|[?&])slides=1(?:&|$)/.test(location.search))L.splice(4,0,'stage.js?v=1');L.forEach(function(f){var e=document.createElement('script');e.src='assets/'+f+'&t='+t;e.async=false;document.body.appendChild(e);});})();</script>
<script>/* auto-update (Jesuye 11-12 11:43 PM "bring back Auto version update refresh"): every 45 s this page reads data/version.json from
its own site; when "v" is above this build's VER it reloads itself once (waiting while anyone drags). Only a version.json bump does this:
data-only commits (news, state, feed) never change "v". One reload per version per tab (sessionStorage), so a stale cache can never loop.
The stage, the root URL and ?slides=1 all keep their own query on reload. */(function(){var VER=500,K='thryd_autover_done';
function idle(){var b=document.body&&document.body.classList;return !!b&&!b.contains('dragmode')&&!document.querySelector('[data-dragging="1"],#objs .dob.lifting,#objs .dob[data-held="1"]');}
function chk(){fetch('data/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){var v=j&&+j.v;if(!v||v<=VER||!idle())return;
var done=0;try{done=+sessionStorage.getItem(K)||0}catch(e){}if(done>=v)return;try{sessionStorage.setItem(K,String(v))}catch(e){}
window.__thrydAutoReload=v;var u=new URL(location.href);u.searchParams.set('v',String(v));location.replace(u.toString());}).catch(function(){});}
window.__thrydVer=VER;setInterval(chk,45000);})();</script>
</body></html>
