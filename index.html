<script>/* auto-update (Jesuye 11-12 11:43 PM "bring back Auto version update refresh"; 17 Nov 10:18 PM ET: do not jump a live viewer):

window.thrydReloadNow=function(){var v=window.__thrydUpdateReady;if(v)go(v);};

if(!idle())return;
var done=0;try{done=+sessionStorage.getItem(K)||0}catch(e){}if(done>=v)return;try{sessionStorage.setItem(K,String(v))}catch(e){}
go(v);}).catch(function(){});}
window.__thrydVer=VER;try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}catch(e){}setTimeout(chk,1500);setInterval(chk,300000);document.addEventListener('visibilitychange',function(){if(document.hidden)chk();});})();</script>
