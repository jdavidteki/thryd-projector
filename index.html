<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache">

<script>/* auto-update: keep ?v= in the URL on the latest deploy, reload when a newer one lands */(function(){var cur=null;function want(){try{return parseInt(new URLSearchParams(location.search).get('v'))||0}catch(e){return 0}}function busy(){try{if(typeof scPaused!=='undefined'&&scPaused)return true;if(typeof HOLD!=='undefined'&&HOLD)return true;if(document.body&&document.body.classList.contains('dragging'))return true;}catch(e){}return false}function chk(){fetch('data/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var v=parseInt(j.v)||0;if(!v)return;if(cur===null){cur=v;if(want()!==v){var u=new URL(location.href);u.searchParams.set('v',v);history.replaceState(null,'',u)}return}if(v>cur){if(busy()){setTimeout(chk,15000);return}var u=new URL(location.href);u.searchParams.set('v',v);location.replace(u.toString())}}).catch(function(){})}chk();setInterval(chk,90000);document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()})})();</script><script>/* loader: fresh JS on every load, in order */(function(){var t=Date.now();['projector.js?v=58','extras.js?v=50','alive.js?v=50'].forEach(function(f){var e=document.createElement('script');e.src='assets/'+f+'&t='+t;e.async=false;document.body.appendChild(e);});})();</script>
